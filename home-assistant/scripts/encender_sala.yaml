# Sustituye script.encender_sala (Ajustes > Automatizaciones > Scripts > Activar sala > ⋮ > Editar en YAML)
# Requiere script.encender_musica (scripts/encender_musica.yaml).
# Enciende las luces y después el sonido, esperando a que esté listo, así el panel muestra
# «Encendiendo…» mientras arranca. mode: single + max_exceeded: silent → ignora pulsaciones repetidas.
alias: Sala ON
mode: single
max_exceeded: silent
icon: mdi:power
sequence:
  - action: switch.turn_on
    target:
      entity_id:
        - switch.sala_1_luz_sala_principal
        - switch.sala_principal_luz_barra
        - switch.shellyplugmg3_08927256e768
  - action: switch.turn_on
    target:
      entity_id: switch.sala_2_luz_sala_2
    continue_on_error: true
  # Llamada directa (no script.turn_on): espera a que termine el arranque del sonido
  - action: script.encender_musica
