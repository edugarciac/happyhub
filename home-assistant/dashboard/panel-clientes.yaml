kiosk_mode:
  non_admin_settings:
    hide_sidebar: true
    hide_header: true
  admin_settings:
    hide_sidebar: false
    hide_header: false
title: HappyHub
views:
  - title: Control
    path: control
    type: sections
    max_columns: 3
    dense_section_placement: true
    background:
      image: /local/happyhub/fondo.jpg
      size: cover
      alignment: center
      attachment: fixed
      opacity: 45
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: horizontal-stack
            grid_options:
              columns: full
            cards:
              - type: custom:mod-card
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.90);
                      border-radius: 20px;
                      padding: 8px;
                    }
                card:
                  type: markdown
                  text_only: true
                  content: >-
                    <center><img src="/local/happyhub/logo.png"
                    width="140"></center>
              - type: markdown
                text_only: true
                content: >
                  <center><h1><font color="white">{{ states('input_text.evento')
                  if states('input_text.evento') not in
                  ['unknown','unavailable',''] else 'Celebra momentos
                  inolvidables' }}</font></h1></center>
              - type: custom:mod-card
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.20);
                      border-radius: 20px;
                      padding: 8px;
                    }
                card:
                  type: horizontal-stack
                  cards:
                    # Sala ON: apagada o a medias (o si falta el sensor)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: sensor.estado_sala
                          state_not:
                            - arrancando
                            - 'on'
                      card:
                        type: custom:mushroom-template-card
                        primary: Sala ON
                        secondary: Luces y música
                        icon: mdi:power
                        icon_color: green
                        layout: vertical
                        tap_action:
                          action: perform-action
                          perform_action: script.encender_sala
                        card_mod:
                          style: |
                            ha-card {
                              background: rgba(76, 175, 80, 0.30);
                              --primary-text-color: white;
                              --secondary-text-color: rgba(255, 255, 255, 0.85);
                              --card-primary-font-size: 20px;
                              --card-primary-line-height: 26px;
                              --card-secondary-font-size: 13px;
                              --icon-size: 44px;
                              text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
                              border: 2px solid #4CAF50;
                              border-radius: 16px;
                            }
                    # Arrancando: aviso, no se puede pulsar
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: sensor.estado_sala
                          state: arrancando
                      card:
                        type: custom:mushroom-template-card
                        primary: Encendiendo sala…
                        secondary: El sonido tardará unos segundos
                        icon: mdi:timer-sand
                        icon_color: amber
                        layout: vertical
                        tap_action:
                          action: none
                        hold_action:
                          action: none
                        card_mod:
                          style: |
                            ha-card {
                              background: rgba(255, 193, 7, 0.30);
                              --primary-text-color: white;
                              --secondary-text-color: rgba(255, 255, 255, 0.85);
                              --card-primary-font-size: 20px;
                              --card-primary-line-height: 26px;
                              --card-secondary-font-size: 13px;
                              --icon-size: 44px;
                              text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
                              border: 2px solid #FFC107;
                              border-radius: 16px;
                              animation: hh-pulse 1.6s ease-in-out infinite;
                            }
                            @keyframes hh-pulse {
                              50% { opacity: 0.6; }
                            }
                    # Sala OFF: encendida o a medias (o si falta el sensor)
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: sensor.estado_sala
                          state_not:
                            - 'off'
                            - arrancando
                      card:
                        type: custom:mushroom-template-card
                        primary: Sala OFF
                        secondary: Apaga todo
                        icon: mdi:power-off
                        icon_color: red
                        layout: vertical
                        tap_action:
                          action: perform-action
                          perform_action: script.cerrar_sala
                          confirmation:
                            text: ¿Desactivar toda la sala?
                        card_mod:
                          style: |
                            ha-card {
                              background: rgba(244, 67, 54, 0.30);
                              --primary-text-color: white;
                              --secondary-text-color: rgba(255, 255, 255, 0.85);
                              --card-primary-font-size: 20px;
                              --card-primary-line-height: 26px;
                              --card-secondary-font-size: 13px;
                              --icon-size: 44px;
                              text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
                              border: 2px solid #F44336;
                              border-radius: 16px;
                            }
                    - type: custom:mushroom-template-card
                      primary: Ayuda
                      secondary: Cómo funciona la sala
                      icon: mdi:help-circle-outline
                      icon_color: white
                      layout: vertical
                      tap_action:
                        action: navigate
                        navigation_path: /panel-clientes/ayuda
                      card_mod:
                        style: |
                          ha-card {
                            background: rgba(255, 255, 255, 0.15);
                            --primary-text-color: white;
                            --secondary-text-color: rgba(255, 255, 255, 0.85);
                            --card-primary-font-size: 20px;
                            --card-primary-line-height: 26px;
                            --card-secondary-font-size: 13px;
                            --icon-size: 44px;
                            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
                            border: 2px solid rgba(255, 255, 255, 0.7);
                            border-radius: 16px;
                          }
      - type: grid
        column_span: 3
        cards:
          - type: horizontal-stack
            grid_options:
              columns: full
            cards:
              - type: custom:mod-card
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 235, 59, 0.35);
                      border-radius: 20px;
                      padding: 8px;
                    }
                card:
                  type: vertical-stack
                  cards:
                    - type: heading
                      heading: Luces
                      icon: mdi:lightbulb-group
                    - type: grid
                      columns: 2
                      square: false
                      cards:
                        - type: custom:mushroom-entity-card
                          entity: switch.sala_1_luz_sala_principal
                          name: Sala Principal
                          icon: mdi:ceiling-light
                          icon_color: amber
                          layout: horizontal
                          tap_action:
                            action: toggle
                        - type: custom:mushroom-entity-card
                          entity: switch.sala_2_luz_sala_2
                          name: Sala Kids
                          icon: mdi:ceiling-light
                          icon_color: amber
                          layout: horizontal
                          tap_action:
                            action: toggle
                        - type: custom:mushroom-entity-card
                          entity: switch.sala_principal_luz_barra
                          name: Barra
                          icon: mdi:glass-cocktail
                          icon_color: amber
                          layout: horizontal
                          tap_action:
                            action: toggle
                        - type: custom:mushroom-entity-card
                          entity: switch.shellyplugmg3_08927256e768
                          name: Jardín
                          icon: mdi:tree
                          icon_color: amber
                          layout: horizontal
                          tap_action:
                            action: toggle
              - type: custom:mod-card
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(3, 169, 244, 0.30);
                      border-radius: 20px;
                      padding: 8px;
                    }
                card:
                  type: vertical-stack
                  cards:
                    - type: heading
                      heading: Aire acondicionado
                      icon: mdi:air-conditioner
                    - type: custom:mushroom-climate-card
                      entity: climate.aidoo_pro
                      name: Sala Principal
                      show_temperature_control: true
                      hvac_modes:
                        - cool
                        - heat
                        - fan_only
                        - 'off'
                      collapsible_controls: false
                    - type: custom:mushroom-climate-card
                      entity: climate.aidoo_pro_2
                      name: Sala Kids
                      show_temperature_control: true
                      hvac_modes:
                        - cool
                        - heat
                        - fan_only
                        - 'off'
                      collapsible_controls: false
              - type: custom:mod-card
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(103, 58, 183, 0.35);
                      border-radius: 20px;
                      padding: 8px;
                    }
                card:
                  type: vertical-stack
                  cards:
                    - type: heading
                      heading: Música
                      icon: mdi:music
                    # Música ON: sonido apagado o incompleto (o si falta el sensor).
                    # Se oculta mientras arranca, así no se puede pulsar varias veces seguidas.
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: sensor.estado_sonido_sala
                          state_not:
                            - arrancando
                            - listo
                      card:
                        type: custom:mushroom-template-card
                        primary: Música ON
                        secondary: >
                          {{ 'Sonido incompleto: púlsalo otra vez'
                             if is_state('sensor.estado_sonido_sala', 'incompleto')
                             else 'Enciende el amplificador y el subwoofer' }}
                        icon: mdi:speaker
                        icon_color: green
                        layout: horizontal
                        tap_action:
                          action: perform-action
                          perform_action: script.encender_musica
                        hold_action:
                          action: none
                        double_tap_action:
                          action: none
                        card_mod:
                          style: |
                            ha-card {
                              border: 2px solid #4CAF50;
                              border-radius: 16px;
                            }
                    # Arrancando: aviso, no se puede pulsar
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: sensor.estado_sonido_sala
                          state: arrancando
                      card:
                        type: custom:mushroom-template-card
                        primary: Encendiendo música…
                        secondary: El sonido tardará unos segundos, espera antes de poner música
                        icon: mdi:timer-sand
                        icon_color: amber
                        layout: horizontal
                        tap_action:
                          action: none
                        hold_action:
                          action: none
                        card_mod:
                          style: |
                            ha-card {
                              border: 2px solid #FFC107;
                              border-radius: 16px;
                              animation: hh-pulse 1.6s ease-in-out infinite;
                            }
                            @keyframes hh-pulse {
                              50% { opacity: 0.6; }
                            }
                    # Listo: solo estado
                    - type: conditional
                      conditions:
                        - condition: state
                          entity: sensor.estado_sonido_sala
                          state: listo
                      card:
                        type: custom:mushroom-template-card
                        primary: Sonido listo
                        secondary: Amplificador y subwoofer encendidos
                        icon: mdi:speaker-wireless
                        icon_color: green
                        layout: horizontal
                        tap_action:
                          action: none
                        hold_action:
                          action: none
                    - type: grid
                      columns: 2
                      square: false
                      cards:
                        - type: custom:mushroom-entity-card
                          entity: switch.sala_principal_amplificador_audio
                          name: Amplificador
                          icon: mdi:amplifier
                          icon_color: green
                          layout: horizontal
                          tap_action:
                            action: none
                          hold_action:
                            action: none
                          double_tap_action:
                            action: none
                        - type: custom:mushroom-entity-card
                          entity: switch.sala_principal_subwoofer
                          name: Subwoofer
                          icon: mdi:speaker
                          icon_color: green
                          layout: horizontal
                          tap_action:
                            action: none
                          hold_action:
                            action: none
                          double_tap_action:
                            action: none
                    - type: grid
                      columns: 2
                      square: false
                      cards:
                        - type: custom:mushroom-template-card
                          primary: Gramola
                          secondary: Elige una lista
                          icon: mdi:record-player
                          icon_color: purple
                          layout: horizontal
                          tap_action:
                            action: navigate
                            navigation_path: /panel-clientes/gramola
                        - type: custom:mushroom-template-card
                          primary: Conectar mi móvil
                          secondary: Pulsa y busca en tu Bluetooth
                          icon: mdi:bluetooth-connect
                          icon_color: blue
                          layout: horizontal
                          tap_action:
                            action: perform-action
                            perform_action: script.modo_bluetooth
                            confirmation:
                              text: >-
                                Si hay otro móvil sonando se desconectará.
                                ¿Continuar?
                    - type: custom:mushroom-template-card
                      primary: >
                        {% set mp = 'media_player.wiim_amp_happyhub' %}
                        {% set src = state_attr(mp, 'source') %}
                        {% set con = states('sensor.conexion_musica_sala') %}
                        {% if states(mp) in ['unavailable', 'unknown', 'off'] %}
                          Equipo de música apagado
                        {% elif src == 'Bluetooth' and is_state(mp, 'playing') %}
                          Móvil conectado
                        {% elif src == 'Bluetooth' %}
                          Listo para conectar
                        {% elif con not in ['unknown', 'unavailable'] %}
                          {{ con }}
                        {% else %}
                          Fuente: {{ src or '—' }}
                        {% endif %}
                      secondary: >
                        {% set mp = 'media_player.wiim_amp_happyhub' %}
                        {% set src = state_attr(mp, 'source') %}
                        {% set t = state_attr(mp, 'media_title') %}
                        {% set a = state_attr(mp, 'media_artist') %}
                        {% set app = state_attr(mp, 'app_name') %}
                        {% set v = state_attr(mp, 'volume_level') %}
                        {% set info = (t ~ ((' — ' ~ a) if a else '')) if t else '' %}
                        {% set vol = (' · 🔊 ' ~ ((v * 100) | round(0) | int) ~ '%'
                          ~ (' (silenciado)' if state_attr(mp, 'is_volume_muted') else '')) if v is not none else '' %}
                        {% if states(mp) in ['unavailable', 'unknown', 'off'] %}
                          Pulsa «Música ON» y espera unos segundos
                        {% elif src == 'Bluetooth' and is_state(mp, 'playing') %}
                          📱 {{ info or 'Sonando desde tu móvil' }}{{ vol }}
                        {% elif src == 'Bluetooth' %}
                          Busca «HappyHub Música» en el Bluetooth de tu móvil
                        {% elif is_state(mp, 'playing') %}
                          🎵 {{ info or 'Sonando' }}{{ ((' · ' ~ app) if app else '') }}{{ vol }}
                        {% elif is_state(mp, 'paused') %}
                          ⏸️ En pausa{{ (': ' ~ info) if info else '' }}{{ vol }}
                        {% else %}
                          Pulsa «Conectar mi móvil» para usar Bluetooth
                        {% endif %}
                      multiline_secondary: true
                      icon: >
                        {% set mp = 'media_player.wiim_amp_happyhub' %}
                        {% set src = (state_attr(mp, 'source') or '') %}
                        {% if states(mp) in ['unavailable', 'unknown', 'off'] %}mdi:volume-off
                        {% elif src == 'Bluetooth' %}mdi:cellphone-sound
                        {% elif 'spotify' in (src ~ (state_attr(mp, 'app_name') or '')) | lower %}mdi:spotify
                        {% elif 'airplay' in src | lower %}mdi:apple
                        {% elif 'line' in src | lower or 'optical' in src | lower %}mdi:cable-data
                        {% else %}mdi:record-player
                        {% endif %}
                      icon_color: >
                        {% set mp = 'media_player.wiim_amp_happyhub' %}
                        {% set src = state_attr(mp, 'source') %}
                        {% if src == 'Bluetooth' %}{{ 'blue' if is_state(mp, 'playing') else 'amber' }}
                        {% elif is_state(mp, 'playing') %}purple
                        {% else %}grey
                        {% endif %}
                      layout: horizontal
                    - type: custom:mushroom-media-player-card
                      entity: media_player.wiim_amp_happyhub
                      name: Sonando ahora
                      use_media_info: true
                      show_volume_level: true
                      media_controls:
                        - previous
                        - play_pause_on
                        - next
                      volume_controls:
                        - volume_set
                        - volume_mute
                      collapsible_controls: false
  - title: Gramola
    path: gramola
    subview: true
    back_path: /panel-clientes/control
    type: sections
    max_columns: 2
    background:
      image: /local/happyhub/fondo.jpg
      size: cover
      alignment: center
      attachment: fixed
      opacity: 45
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🎶 Gramola HappyHub
          - type: custom:mushroom-template-card
            primary: Música Española
            icon: mdi:guitar-acoustic
            icon_color: red
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: linkplay.play_preset
              target:
                entity_id: media_player.wiim_amp_happyhub
              data:
                preset_number: 1
          - type: custom:mushroom-template-card
            primary: Cumpleaños
            icon: mdi:cake-variant
            icon_color: pink
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: linkplay.play_preset
              target:
                entity_id: media_player.wiim_amp_happyhub
              data:
                preset_number: 2
          - type: custom:mushroom-template-card
            primary: Verbena
            icon: mdi:firework
            icon_color: orange
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: linkplay.play_preset
              target:
                entity_id: media_player.wiim_amp_happyhub
              data:
                preset_number: 3
          - type: custom:mushroom-template-card
            primary: Remember
            icon: mdi:cassette
            icon_color: purple
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: linkplay.play_preset
              target:
                entity_id: media_player.wiim_amp_happyhub
              data:
                preset_number: 4
      - type: grid
        cards:
          - type: custom:mini-media-player
            entity: media_player.wiim_amp_happyhub
            artwork: full-cover
            info: scroll
            hide:
              power: true
              source: true
              controls: true
              volume: true
              progress: false
            grid_options:
              columns: full
          - type: custom:mushroom-media-player-card
            entity: media_player.wiim_amp_happyhub
            name: Sonando ahora
            use_media_info: true
            show_volume_level: true
            media_controls:
              - previous
              - play_pause_on
              - next
            volume_controls:
              - volume_set
              - volume_mute
            collapsible_controls: false
            grid_options:
              columns: full
          - type: custom:mushroom-template-card
            primary: Conectar mi móvil
            secondary: Pulsa y busca en tu Bluetooth
            icon: mdi:bluetooth-connect
            icon_color: blue
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: script.modo_bluetooth
              confirmation:
                text: Si hay otro móvil sonando se desconectará. ¿Continuar?
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            primary: >
              {% set mp = 'media_player.wiim_amp_happyhub' %}
              {% set src = state_attr(mp, 'source') %}
              {% set con = states('sensor.conexion_musica_sala') %}
              {% if states(mp) in ['unavailable', 'unknown', 'off'] %}
                Equipo de música apagado
              {% elif src == 'Bluetooth' and is_state(mp, 'playing') %}
                Móvil conectado
              {% elif src == 'Bluetooth' %}
                Listo para conectar
              {% elif con not in ['unknown', 'unavailable'] %}
                {{ con }}
              {% else %}
                Fuente: {{ src or '—' }}
              {% endif %}
            secondary: >
              {% set mp = 'media_player.wiim_amp_happyhub' %}
              {% set src = state_attr(mp, 'source') %}
              {% set t = state_attr(mp, 'media_title') %}
              {% set a = state_attr(mp, 'media_artist') %}
              {% set app = state_attr(mp, 'app_name') %}
              {% set v = state_attr(mp, 'volume_level') %}
              {% set info = (t ~ ((' — ' ~ a) if a else '')) if t else '' %}
              {% set vol = (' · 🔊 ' ~ ((v * 100) | round(0) | int) ~ '%'
                ~ (' (silenciado)' if state_attr(mp, 'is_volume_muted') else '')) if v is not none else '' %}
              {% if states(mp) in ['unavailable', 'unknown', 'off'] %}
                Pulsa «Música ON» y espera unos segundos
              {% elif src == 'Bluetooth' and is_state(mp, 'playing') %}
                📱 {{ info or 'Sonando desde tu móvil' }}{{ vol }}
              {% elif src == 'Bluetooth' %}
                Busca «HappyHub Música»
              {% elif is_state(mp, 'playing') %}
                🎵 {{ info or 'Sonando' }}{{ ((' · ' ~ app) if app else '') }}{{ vol }}
              {% elif is_state(mp, 'paused') %}
                ⏸️ En pausa{{ (': ' ~ info) if info else '' }}{{ vol }}
              {% else %}
                Sin Bluetooth
              {% endif %}
            multiline_secondary: true
            icon: >
              {% set mp = 'media_player.wiim_amp_happyhub' %}
              {% set src = (state_attr(mp, 'source') or '') %}
              {% if states(mp) in ['unavailable', 'unknown', 'off'] %}mdi:volume-off
              {% elif src == 'Bluetooth' %}mdi:cellphone-sound
              {% elif 'spotify' in (src ~ (state_attr(mp, 'app_name') or '')) | lower %}mdi:spotify
              {% elif 'airplay' in src | lower %}mdi:apple
              {% elif 'line' in src | lower or 'optical' in src | lower %}mdi:cable-data
              {% else %}mdi:record-player
              {% endif %}
            icon_color: >
              {% set mp = 'media_player.wiim_amp_happyhub' %}
              {% set src = state_attr(mp, 'source') %}
              {% if src == 'Bluetooth' %}{{ 'blue' if is_state(mp, 'playing') else 'amber' }}
              {% elif is_state(mp, 'playing') %}purple
              {% else %}grey
              {% endif %}
            layout: vertical
            grid_options:
              columns: 6
          # Música ON (solo si el sonido no está listo ni arrancando)
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.estado_sonido_sala
                state_not:
                  - arrancando
                  - listo
            card:
              type: custom:mushroom-template-card
              primary: Música ON
              secondary: Enciende el amplificador y el subwoofer
              icon: mdi:speaker
              icon_color: green
              layout: horizontal
              tap_action:
                action: perform-action
                perform_action: script.encender_musica
              hold_action:
                action: none
              double_tap_action:
                action: none
              card_mod:
                style: |
                  ha-card {
                    border: 2px solid #4CAF50;
                    border-radius: 16px;
                  }
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.estado_sonido_sala
                state: arrancando
            card:
              type: custom:mushroom-template-card
              primary: Encendiendo música…
              secondary: El sonido tardará unos segundos
              icon: mdi:timer-sand
              icon_color: amber
              layout: horizontal
              tap_action:
                action: none
              hold_action:
                action: none
            grid_options:
              columns: full
          - type: custom:mushroom-template-card
            primary: Volver
            icon: mdi:arrow-left
            icon_color: grey
            tap_action:
              action: navigate
              navigation_path: /panel-clientes/control
            grid_options:
              columns: full
  - title: Ayuda
    path: ayuda
    subview: true
    back_path: /panel-clientes/control
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Volver al panel
            icon: mdi:arrow-left
            icon_color: grey
            tap_action:
              action: navigate
              navigation_path: /panel-clientes/control
          - type: iframe
            url: https://www.happyhub.es/guia-sala/panel
            aspect_ratio: 140%
