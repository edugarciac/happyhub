# Tarjetas para el dashboard panel-clientes (Editar dashboard > Añadir tarjeta > Manual)
# Solo tarjetas del núcleo de Home Assistant (no requiere HACS).

# ─── 1. Botón Activar SALA / Desactivar SALA ──────────────────────────────
# Sustituye a los botones Activar y Desactivar actuales.
type: vertical-stack
cards:
  # Apagado o incompleto → Activar SALA
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.estado_sonido_sala
        state:
          - apagado
          - incompleto
    card:
      type: button
      name: Activar SALA
      icon: mdi:power
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.encender_sala
      hold_action:
        action: none

  # Arrancando → aviso (no se puede pulsar)
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.estado_sonido_sala
        state: arrancando
    card:
      type: markdown
      content: >
        ## ⏳ Activando la sala…

        **El sonido tardará unos segundos en activarse.** Espera a que
        aparezca *Sonido listo* antes de poner música.

  # Incompleto → aviso
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.estado_sonido_sala
        state: incompleto
    card:
      type: markdown
      content: >
        ⚠️ **El sonido no está completo.** Pulsa **Activar SALA** otra vez
        y espera unos segundos.

  # Encendido o incompleto → Desactivar SALA
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.estado_sonido_sala
        state:
          - listo
          - incompleto
    card:
      type: button
      name: Desactivar SALA
      icon: mdi:power-off
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.cerrar_sala
        confirmation:
          text: ¿Desactivar toda la sala?
      hold_action:
        action: none

---
# ─── 2. Equipo de sonido (solo lectura) ──────────────────────────────────
type: vertical-stack
title: Equipo de sonido
cards:
  - type: markdown
    content: >
      {% set s = states('sensor.estado_sonido_sala') %}
      {% if s == 'listo' %}🟢 **Sonido listo**
      {% elif s == 'arrancando' %}⏳ **Arrancando… unos segundos**
      {% elif s == 'incompleto' %}🟠 **Sonido incompleto**: pulsa Activar SALA
      {% else %}⚫ **Sonido apagado**: pulsa Activar SALA
      {% endif %}
  - type: horizontal-stack
    cards:
      - type: tile
        entity: switch.sala_principal_amplificador_audio
        name: Amplificador
        icon: mdi:amplifier
        color: green
        tap_action:
          action: none
        icon_tap_action:
          action: none
        hold_action:
          action: none
      - type: tile
        entity: switch.sala_principal_subwoofer
        name: Subwoofer
        icon: mdi:speaker
        color: green
        tap_action:
          action: none
        icon_tap_action:
          action: none
        hold_action:
          action: none

---
# ─── 3. Qué está sonando / quién está conectado ──────────────────────────
type: markdown
title: Qué está sonando
content: >
  {% set mp = 'media_player.wiim_amp_happyhub' %}
  {% set st = states(mp) %}
  {% set con = states('sensor.conexion_musica_sala') %}
  {% set icons = {'Móvil por Bluetooth': '📱', 'Spotify Connect': '🟢',
                  'AirPlay': '🍎', 'Gramola (WiFi)': '📻', 'Sin conexión': '⚫'} %}
  {{ icons.get(con, '🔌') }} **{{ con }}**
  {%- set dev = state_attr(mp, 'bluetooth_device') or state_attr(mp, 'device_name_connected') %}
  {%- if dev %} · {{ dev }}{% endif %}

  {% if st not in ['unavailable', 'unknown', 'off'] -%}
  {%- set app = state_attr(mp, 'app_name') -%}
  {%- if app %}App: **{{ app }}**  
  {% endif -%}
  {%- set t = state_attr(mp, 'media_title') -%}
  {%- set a = state_attr(mp, 'media_artist') -%}
  {%- if t %}🎵 **{{ t }}**{% if a %} — {{ a }}{% endif %}  
  {% endif -%}
  {{ {'playing': '▶️ Sonando', 'paused': '⏸️ En pausa', 'idle': '⏹️ Parado',
      'on': '⏹️ Parado'}.get(st, st) }}
  {%- set v = state_attr(mp, 'volume_level') %}
  {%- if v is not none %} · 🔊 {{ (v * 100) | round }}%{% endif %}
  {%- if state_attr(mp, 'is_volume_muted') %} (silenciado){% endif %}
  {%- else -%}
  El equipo está apagado. Pulsa **Activar SALA**.
  {%- endif %}
