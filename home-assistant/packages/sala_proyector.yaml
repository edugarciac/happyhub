# Proyector de la sala (Chromecast «Proyector»)
# Instalar: copiar a /config/packages/ (ver README.md)
#
# Requisitos:
# - Chromecast integrado en HA (Google Cast) como media_player.proyector (verifica el id).
# - Ficheros de fondo en /media/happyhub/proyector/ : happyhub.jpg y happyhub.mp4
# - Ajustes > Sistema > Red > URL local de HA con IP (http://192.168.x.x:8123):
#   el Chromecast no resuelve homeassistant.local.

input_select:
  fondo_proyector:
    name: Fondo del proyector
    icon: mdi:image
    options:
      - HappyHub imagen
      - HappyHub vídeo
      - Fondo del Chromecast
    initial: HappyHub imagen

template:
  - sensor:
      # apagado: el Chromecast no responde (proyector apagado, si se alimenta de él)
      # fondo: mostrando un fondo de HappyHub
      # proyectando: un cliente está enviando contenido
      # listo: encendido y sin contenido
      - name: Estado proyector
        unique_id: estado_proyector
        state: >
          {% set mp = 'media_player.proyector' %}
          {% set st = states(mp) %}
          {% set contenido = (state_attr(mp, 'media_content_id') or '') %}
          {% if st in ['unavailable', 'unknown'] %}apagado
          {% elif 'happyhub/proyector' in contenido and st not in ['off'] %}fondo
          {% elif st in ['playing', 'paused', 'buffering'] %}proyectando
          {% else %}listo
          {% endif %}
        icon: >
          {{ {'apagado': 'mdi:projector-off', 'proyectando': 'mdi:cast-connected'}.get(this.state, 'mdi:projector') }}

script:
  proyector_poner_fondo:
    alias: Proyector - poner fondo
    mode: single
    max_exceeded: silent
    icon: mdi:image
    sequence:
      # Nunca interrumpe a un cliente que está proyectando
      - condition: template
        value_template: "{{ states('sensor.estado_proyector') in ['listo', 'fondo'] }}"
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.fondo_proyector
                state: HappyHub imagen
            sequence:
              - action: media_player.play_media
                target:
                  entity_id: media_player.proyector
                data:
                  media_content_id: media-source://media_source/local/happyhub/proyector/happyhub.jpg
                  media_content_type: image/jpeg
          - conditions:
              - condition: state
                entity_id: input_select.fondo_proyector
                state: HappyHub vídeo
            sequence:
              - action: media_player.play_media
                target:
                  entity_id: media_player.proyector
                data:
                  media_content_id: media-source://media_source/local/happyhub/proyector/happyhub.mp4
                  media_content_type: video/mp4
        # Fondo del Chromecast: si está el de HappyHub, se para y vuelve el modo ambiente
        default:
          - if:
              - condition: state
                entity_id: sensor.estado_proyector
                state: fondo
            then:
              - action: media_player.turn_off
                target:
                  entity_id: media_player.proyector

automation:
  - id: proyector_fondo_auto
    alias: Proyector - fondo cuando no se proyecta nada
    mode: restart
    triggers:
      # Proyector libre 10 s (recién encendido, un cliente deja de enviar o termina el vídeo)
      - trigger: state
        entity_id: sensor.estado_proyector
        to: listo
        for: "00:00:10"
      # El cliente cambia el fondo en el panel
      - trigger: state
        entity_id: input_select.fondo_proyector
    conditions:
      - condition: template
        value_template: "{{ states('sensor.estado_proyector') in ['listo', 'fondo'] }}"
    actions:
      - action: script.proyector_poner_fondo
