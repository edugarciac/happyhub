# Recordatorio de la señal (24 h) y cancelación (48 h) de reservas sin pagar.
# El cron de Vercel (plan Hobby) solo corre una vez al día; este workflow lo llama cada hora.
# Secretos del repo: CRON_SECRET (el mismo que en Vercel) y, opcional, SITE_URL.
name: Reservas sin pagar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          url="${SITE_URL:-https://www.happyhub.es}/api/cron/expire-reservations"
          curl --fail-with-body -sS -m 60 -H "Authorization: Bearer ${CRON_SECRET}" "$url"
