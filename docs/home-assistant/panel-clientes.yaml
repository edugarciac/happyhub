# Panel de la tablet de la sala (dashboard "panel-clientes").
# Ajustes → Paneles → panel-clientes → ✏️ Editar → ⋮ → Editor de configuración en bruto → pegar todo → Guardar.
# Requiere (HACS → Frontend): Mushroom, card-mod, Mini Media Player y Kiosk Mode.
# La URL del panel debe ser exactamente "panel-clientes": los botones navegan a /panel-clientes/...
kiosk_mode:
  non_admin_settings:
    hide_sidebar: true
    hide_header: true
  admin_settings:
    hide_sidebar: false
    hide_header: false
title: HappyHub
views:
  # ───────── PANEL PRINCIPAL ─────────
  - title: Control
    path: control
    type: sections
    max_columns: 3
    dense_section_placement: true
    background:
      image: /local/happyhub/fondo.jpg
      size: cover
      alignment: center
      attachment: fixed
      opacity: 45
    sections:
      # Logo + evento + Activar / Desactivar / Ayuda
      - type: grid
        column_span: 3
        cards:
          - type: horizontal-stack
            grid_options:
              columns: full
            cards:
              - type: custom:mod-card
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.90);
                      border-radius: 20px;
                      padding: 8px;
                    }
                card:
                  type: markdown
                  text_only: true
                  content: '<center><img src="/local/happyhub/logo.png" width="140"></center>'
              - type: markdown
                text_only: true
                content: >
                  <center><h1><font color="white">{{ states('input_text.evento') if states('input_text.evento') not in ['unknown','unavailable',''] else 'Celebra momentos inolvidables' }}</font></h1></center>
              - type: custom:mod-card
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 255, 255, 0.20);
                      border-radius: 20px;
                      padding: 8px;
                    }
                card:
                  type: horizontal-stack
                  cards:
                    - type: custom:mushroom-template-card
                      primary: Activar
                      secondary: Luces y música
                      icon: mdi:power
                      icon_color: green
                      layout: vertical
                      tap_action:
                        action: perform-action
                        perform_action: script.encender_sala
                      card_mod:
                        style: |
                          ha-card {
                            background: rgba(76, 175, 80, 0.30);
                            --primary-text-color: white;
                            --secondary-text-color: rgba(255, 255, 255, 0.85);
                            --card-primary-font-size: 20px;
                            --card-primary-line-height: 26px;
                            --card-secondary-font-size: 13px;
                            --icon-size: 44px;
                            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
                            border: 2px solid #4CAF50;
                            border-radius: 16px;
                          }
                    - type: custom:mushroom-template-card
                      primary: Desactivar
                      secondary: Apaga todo
                      icon: mdi:power-off
                      icon_color: red
                      layout: vertical
                      tap_action:
                        action: perform-action
                        perform_action: script.cerrar_sala
                        confirmation:
                          text: ¿Desactivar toda la sala?
                      card_mod:
                        style: |
                          ha-card {
                            background: rgba(244, 67, 54, 0.30);
                            --primary-text-color: white;
                            --secondary-text-color: rgba(255, 255, 255, 0.85);
                            --card-primary-font-size: 20px;
                            --card-primary-line-height: 26px;
                            --card-secondary-font-size: 13px;
                            --icon-size: 44px;
                            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
                            border: 2px solid #F44336;
                            border-radius: 16px;
                          }
                    - type: custom:mushroom-template-card
                      primary: Ayuda
                      secondary: Cómo funciona la sala
                      icon: mdi:help-circle-outline
                      icon_color: white
                      layout: vertical
                      tap_action:
                        action: navigate
                        navigation_path: /panel-clientes/ayuda
                      card_mod:
                        style: |
                          ha-card {
                            background: rgba(255, 255, 255, 0.15);
                            --primary-text-color: white;
                            --secondary-text-color: rgba(255, 255, 255, 0.85);
                            --card-primary-font-size: 20px;
                            --card-primary-line-height: 26px;
                            --card-secondary-font-size: 13px;
                            --icon-size: 44px;
                            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
                            border: 2px solid rgba(255, 255, 255, 0.7);
                            border-radius: 16px;
                          }

      # Luces + Aire + Música (siempre 3 columnas)
      - type: grid
        column_span: 3
        cards:
          - type: horizontal-stack
            grid_options:
              columns: full
            cards:
              # Luces
              - type: custom:mod-card
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(255, 235, 59, 0.35);
                      border-radius: 20px;
                      padding: 8px;
                    }
                card:
                  type: vertical-stack
                  cards:
                    - type: heading
                      heading: Luces
                      icon: mdi:lightbulb-group
                    - type: grid
                      columns: 2
                      square: false
                      cards:
                      - type: custom:mushroom-entity-card
                        entity: switch.sala_1_luz_sala_principal
                        name: Sala Principal
                        icon: mdi:ceiling-light
                        icon_color: amber
                        layout: horizontal
                        tap_action:
                          action: toggle
                      - type: custom:mushroom-entity-card
                        entity: switch.sala_2_luz_sala_2
                        name: Sala Kids
                        icon: mdi:ceiling-light
                        icon_color: amber
                        layout: horizontal
                        tap_action:
                          action: toggle
                      - type: custom:mushroom-entity-card
                        entity: switch.sala_principal_luz_barra
                        name: Barra
                        icon: mdi:glass-cocktail
                        icon_color: amber
                        layout: horizontal
                        tap_action:
                          action: toggle
                      - type: custom:mushroom-entity-card
                        entity: switch.shellyplugmg3_08927256e768
                        name: Jardín
                        icon: mdi:tree
                        icon_color: amber
                        layout: horizontal
                        tap_action:
                          action: toggle

              # Aire acondicionado
              - type: custom:mod-card
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(3, 169, 244, 0.30);
                      border-radius: 20px;
                      padding: 8px;
                    }
                card:
                  type: vertical-stack
                  cards:
                    - type: heading
                      heading: Aire acondicionado
                      icon: mdi:air-conditioner
                    - type: custom:mushroom-climate-card
                      entity: climate.aidoo_pro
                      name: Sala Principal
                      show_temperature_control: true
                      hvac_modes: [cool, heat, fan_only, "off"]
                      collapsible_controls: false
                    - type: custom:mushroom-climate-card
                      entity: climate.aidoo_pro_2
                      name: Sala Kids
                      show_temperature_control: true
                      hvac_modes: [cool, heat, fan_only, "off"]
                      collapsible_controls: false

              # Música
              - type: custom:mod-card
                card_mod:
                  style: |
                    ha-card {
                      background: rgba(103, 58, 183, 0.35);
                      border-radius: 20px;
                      padding: 8px;
                    }
                card:
                  type: vertical-stack
                  cards:
                    - type: heading
                      heading: Música
                      icon: mdi:music
                    - type: grid
                      columns: 2
                      square: false
                      cards:
                      - type: custom:mushroom-template-card
                        primary: Gramola
                        secondary: Elige una lista
                        icon: mdi:record-player
                        icon_color: purple
                        layout: horizontal
                        tap_action:
                          action: navigate
                          navigation_path: /panel-clientes/gramola
                      # Botón único: libera el BT anterior y entra en emparejamiento
                      - type: custom:mushroom-template-card
                        primary: Conectar mi móvil
                        secondary: Pulsa y busca en tu Bluetooth
                        icon: mdi:bluetooth-connect
                        icon_color: blue
                        layout: horizontal
                        tap_action:
                          action: perform-action
                          perform_action: script.modo_bluetooth
                          confirmation:
                            text: Si hay otro móvil sonando se desconectará. ¿Continuar?
                    # Estado + instrucciones para el cliente
                    - type: custom:mushroom-template-card
                      primary: >
                        {% set src = state_attr('media_player.wiim_amp_happyhub','source') %}
                        {% if src == 'Bluetooth' and is_state('media_player.wiim_amp_happyhub','playing') %}
                          Móvil conectado
                        {% elif src == 'Bluetooth' %}
                          Listo para conectar
                        {% else %}
                          Fuente: {{ src or '—' }}
                        {% endif %}
                      secondary: >
                        {% set src = state_attr('media_player.wiim_amp_happyhub','source') %}
                        {% if src == 'Bluetooth' and is_state('media_player.wiim_amp_happyhub','playing') %}
                          Sonando desde tu móvil
                        {% elif src == 'Bluetooth' %}
                          Busca «HappyHub Música» en el Bluetooth de tu móvil
                        {% else %}
                          Pulsa «Conectar mi móvil» para usar Bluetooth
                        {% endif %}
                      icon: mdi:cellphone-sound
                      icon_color: >
                        {% set src = state_attr('media_player.wiim_amp_happyhub','source') %}
                        {{ 'blue' if src == 'Bluetooth' and is_state('media_player.wiim_amp_happyhub','playing')
                           else ('amber' if src == 'Bluetooth' else 'grey') }}
                      layout: horizontal
                    - type: custom:mushroom-media-player-card
                      entity: media_player.wiim_amp_happyhub
                      name: Sonando ahora
                      use_media_info: true
                      show_volume_level: true
                      media_controls:
                        - previous
                        - play_pause_on
                        - next
                      volume_controls:
                        - volume_set
                        - volume_mute
                      collapsible_controls: false

  # ───────── GRAMOLA ─────────
  - title: Gramola
    path: gramola
    subview: true
    back_path: /panel-clientes/control
    type: sections
    max_columns: 2
    background:
      image: /local/happyhub/fondo.jpg
      size: cover
      alignment: center
      attachment: fixed
      opacity: 45
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 🎶 Gramola HappyHub
          - type: custom:mushroom-template-card
            primary: Música Española
            icon: mdi:guitar-acoustic
            icon_color: red
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: linkplay.play_preset
              target:
                entity_id: media_player.wiim_amp_happyhub
              data:
                preset_number: 1
          - type: custom:mushroom-template-card
            primary: Cumpleaños
            icon: mdi:cake-variant
            icon_color: pink
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: linkplay.play_preset
              target:
                entity_id: media_player.wiim_amp_happyhub
              data:
                preset_number: 2
          - type: custom:mushroom-template-card
            primary: Verbena
            icon: mdi:firework
            icon_color: orange
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: linkplay.play_preset
              target:
                entity_id: media_player.wiim_amp_happyhub
              data:
                preset_number: 3
          - type: custom:mushroom-template-card
            primary: Remember
            icon: mdi:cassette
            icon_color: purple
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: linkplay.play_preset
              target:
                entity_id: media_player.wiim_amp_happyhub
              data:
                preset_number: 4

      - type: grid
        cards:
          - type: custom:mini-media-player
            entity: media_player.wiim_amp_happyhub
            artwork: full-cover
            info: scroll
            hide:
              power: true
              source: true
              controls: true
              volume: true
              progress: false
            grid_options:
              columns: full
          - type: custom:mushroom-media-player-card
            entity: media_player.wiim_amp_happyhub
            name: Sonando ahora
            use_media_info: true
            show_volume_level: true
            media_controls:
              - previous
              - play_pause_on
              - next
            volume_controls:
              - volume_set
              - volume_mute
            collapsible_controls: false
            grid_options:
              columns: full
          - type: custom:mushroom-template-card
            primary: Conectar mi móvil
            secondary: Pulsa y busca en tu Bluetooth
            icon: mdi:bluetooth-connect
            icon_color: blue
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: script.modo_bluetooth
              confirmation:
                text: Si hay otro móvil sonando se desconectará. ¿Continuar?
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            primary: >
              {% set src = state_attr('media_player.wiim_amp_happyhub','source') %}
              {% if src == 'Bluetooth' and is_state('media_player.wiim_amp_happyhub','playing') %}
                Móvil conectado
              {% elif src == 'Bluetooth' %}
                Listo para conectar
              {% else %}
                Fuente: {{ src or '—' }}
              {% endif %}
            secondary: >
              {% set src = state_attr('media_player.wiim_amp_happyhub','source') %}
              {% if src == 'Bluetooth' and is_state('media_player.wiim_amp_happyhub','playing') %}
                Sonando desde tu móvil
              {% elif src == 'Bluetooth' %}
                Busca «HappyHub Música»
              {% else %}
                Sin Bluetooth
              {% endif %}
            icon: mdi:cellphone-sound
            icon_color: >
              {% set src = state_attr('media_player.wiim_amp_happyhub','source') %}
              {{ 'blue' if src == 'Bluetooth' and is_state('media_player.wiim_amp_happyhub','playing')
                 else ('amber' if src == 'Bluetooth' else 'grey') }}
            layout: vertical
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            primary: Volver
            icon: mdi:arrow-left
            icon_color: grey
            tap_action:
              action: navigate
              navigation_path: /panel-clientes/control
            grid_options:
              columns: full

  # ───────── AYUDA (guía de la sala de happyhub.es) ─────────
  # La web solo deja mostrar la guía si Home Assistant se abre como http(s)://homeassistant.local (sin puerto).
  - title: Ayuda
    path: ayuda
    subview: true
    back_path: /panel-clientes/control
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Volver al panel
            icon: mdi:arrow-left
            icon_color: grey
            tap_action:
              action: navigate
              navigation_path: /panel-clientes/control
          - type: iframe
            url: https://www.happyhub.es/guia-sala/panel
            aspect_ratio: 140%
