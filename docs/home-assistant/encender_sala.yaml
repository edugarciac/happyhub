# Ajustes → Automatizaciones y escenas → Scripts → "Encender sala" → ⋮ → Editar en YAML
# Pegar todo y guardar. Novedad: enciende también la luz de la Barra.
alias: Encender sala
icon: mdi:lightbulb-on
sequence:
  - action: switch.turn_on
    target:
      entity_id:
        - switch.sala_1_luz_sala_principal
        - switch.sala_principal_luz_barra
        - switch.shellyplugmg3_08927256e768
        - switch.sala_principal_amplificador_audio
  - action: switch.turn_on
    target:
      entity_id: switch.sala_2_luz_sala_2
    continue_on_error: true
  - delay: '00:00:03'
  - action: switch.turn_on
    target:
      entity_id: switch.sala_principal_subwoofer
mode: single
